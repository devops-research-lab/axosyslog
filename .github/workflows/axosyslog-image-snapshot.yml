name: AxoSyslog snapshot image
on:
  push: null
jobs:
  publish-image:
    permissions: write-all
    uses: ./.github/workflows/axosyslog-docker.yml
    needs: prepare
    with:
      type: snapshot
      platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
      snapshot-tarball-artifact: source-tarball
      snapshot-version: ${{ needs.prepare.outputs.snapshot-version }}
      snapshot-tags: ${{ needs.prepare.outputs.tag }}
  prepare:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/axosyslog
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      snapshot-version: ${{ steps.snapshot-version.outputs.SNAPSHOT_VERSION }}
    steps:
    - name: Determine tag
      id: tag
      run: "IMAGE_NAME=\"$(echo \"$IMAGE_NAME\" | tr '[:upper:]' '[:lower:]')\"\n\ncase \"${{ inputs.type\
        \ || 'branch' }}\" in\n  branch)\n    tag=\"dev-${{ github.ref_name }}\"\n    ;;\n  custom)\n\
        \    if docker manifest inspect \"$IMAGE_NAME:${{ inputs.custom-image-tag }}\" > /dev/null 2>&1;\
        \ then\n      echo \"Custom tag '${{ inputs.custom-image-tag }}' already exists.\"\n      exit\
        \ 1\n    fi\n    tag=\"${{ inputs.custom-image-tag }}\"\n    ;;\nesac\necho \"tag=${tag}\" >>\
        \ $GITHUB_OUTPUT\necho \"tag=${tag}\"\n"
    - name: Checkout AxoSyslog source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Prepare docker image
      run: ./dbld/rules cache-image-tarball
    - name: Create source tarball
      run: ./dbld/rules pkg-tarball
    - name: Determine snapshot version
      id: snapshot-version
      run: 'tarball_filename="$(find dbld/build -name ''*.tar.*'' -printf ''%f\n'')"

        tarball_name="${tarball_filename/\.tar.*}"

        tarball_version="${tarball_name/axosyslog-}"

        pkg_version_prefix="$(echo $tarball_version | sed -En ''s|(([0-9]+\.){2}[0-9]+).*|\1|p'')"

        [ -z "$pkg_version_prefix" ] && echo "Error: tarball name contains invalid version prefix" &&
        exit 1


        pkg_version="${pkg_version_prefix}_git$(date +%Y%m%d)"

        echo "SNAPSHOT_VERSION=${pkg_version}" >> $GITHUB_OUTPUT

        '
